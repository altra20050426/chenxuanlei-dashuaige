<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>陈炫雷大帅哥</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, .22), transparent 28%),
        linear-gradient(135deg, #4f46e5 0%, #9333ea 52%, #ec4899 100%);
    }

    main {
      width: min(88vw, 960px);
      padding: clamp(2.5rem, 8vw, 6rem) 1.5rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 2rem;
      background: rgba(255, 255, 255, .12);
      box-shadow: 0 2rem 5rem rgba(31, 20, 80, .28);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(2.5rem, 9vw, 7rem);
      line-height: 1.15;
      letter-spacing: .08em;
      text-shadow: 0 .15rem .5rem rgba(40, 12, 75, .25);
    }

    #titleToggle {
      padding: 0;
      border: 0;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      background: transparent;
      cursor: pointer;
    }

    #titleToggle:focus-visible {
      outline: .2rem solid rgba(255, 255, 255, .9);
      outline-offset: .35rem;
      border-radius: .35rem;
    }
  </style>
</head>
<body>
  <main>
    <h1><button id="titleToggle" type="button" aria-live="polite">陈炫雷大帅哥</button></h1>
  </main>
  <script>
    const titleToggle = document.querySelector('#titleToggle');
    titleToggle.addEventListener('click', () => {
      titleToggle.textContent = titleToggle.textContent === '陈炫雷大帅哥'
        ? '陈炫雷大猪逼'
        : '陈炫雷大帅哥';
    });
  </script>
</body>
</html>
